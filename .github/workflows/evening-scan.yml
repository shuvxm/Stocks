# Save in the repo as .github/workflows/evening-scan.yml
name: Evening swing scan
on:
  # Exact 16:30 IST start comes from an outside scheduler (cron-job.org) pressing workflow_dispatch.
  # GitHub's own timer below runs hours late, so it is only a backup and skips if the scan already ran.
  schedule:
    - cron: "37 11 * * 1-5"  # 17:07 IST, Mon-Fri - backup only
  workflow_dispatch: {}      # exact-time trigger + "Run workflow" button for a manual test
permissions:
  contents: read
  actions: read
jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # start of the current slot: the most recent 16:25 IST
            since=$(TZ=Asia/Kolkata date -d "16:25" +%s)
            if [ "$since" -gt "$(date +%s)" ]; then since=$((since - 86400)); fi
            ran=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow evening-scan.yml --limit 30 \
              --json databaseId,createdAt,status,conclusion \
              --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID)
                         | select((.createdAt | fromdateiso8601) >= $since)
                         | select(.status != \"completed\" or .conclusion == \"success\")] | length")
            if [ "$ran" -gt 0 ]; then run=false; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
  scan:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write          # the report is committed back into the repo
    env:
      TZ: Asia/Kolkata         # report file name and "Generated" time in IST
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install yfinance pandas numpy openpyxl requests
      - name: Run equity screener
        working-directory: Equity
        run: python indian_stock_swing_analyst.py --universe NSE_LISTED --smallcap   # every NSE-listed stock
      # Old reports stay in the repo, so pick out only the file this run just wrote
      - name: Find today's report
        id: report
        run: echo "file=$(ls -t Equity/output/daily/SwingStocks_*.xlsx | head -n 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: swing-report-${{ github.run_id }}
          path: ${{ steps.report.outputs.file }}
      - name: Email report
        if: env.MAIL_PASSWORD != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: Swing scan report
          to: ${{ secrets.MAIL_TO }}
          from: Swing scanner <${{ secrets.MAIL_USERNAME }}>
          body: Today's swing picks are attached.
          attachments: ${{ steps.report.outputs.file }}
      - name: Save report in the repo (Equity/output/daily)
        if: ${{ !cancelled() && steps.report.outputs.file != '' }}
        env:
          REPORT: ${{ steps.report.outputs.file }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$REPORT"
          if git diff --cached --quiet; then echo "Report unchanged, nothing to commit"; exit 0; fi
          git commit -m "Evening scan report: $(basename "$REPORT")"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
