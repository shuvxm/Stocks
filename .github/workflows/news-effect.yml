name: Sunday news effect report
on:
  # Exact 19:00 IST start comes from an outside scheduler (cron-job.org) pressing workflow_dispatch.
  # GitHub's own timer below runs hours late, so it is only a backup and skips if the report already ran.
  schedule:
    - cron: "37 13 * * 0"    # 19:07 IST, Sunday - backup only
  workflow_dispatch: {}      # exact-time trigger + "Run workflow" button for a manual test
permissions:
  contents: read
  actions: read
jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # start of the current slot: the most recent 18:55 IST
            since=$(TZ=Asia/Kolkata date -d "18:55" +%s)
            if [ "$since" -gt "$(date +%s)" ]; then since=$((since - 86400)); fi
            ran=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow news-effect.yml --limit 30 \
              --json databaseId,createdAt,status,conclusion \
              --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID)
                         | select((.createdAt | fromdateiso8601) >= $since)
                         | select(.status != \"completed\" or .conclusion == \"success\")] | length")
            if [ "$ran" -gt 0 ]; then run=false; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
  report:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Kolkata         # report date in IST
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install yfinance pandas numpy openpyxl requests
      - run: rm -f Equity/output/news/*.xlsx
      - name: Build news effect report
        working-directory: Equity
        run: python news_effect_report.py --universe NIFTY500
      - id: name
        run: echo "report=NewsEffectStocks_$(date +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.report }}
          path: Equity/output/news/*.xlsx
      - name: Email report
        if: env.MAIL_PASSWORD != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ steps.name.outputs.report }}
          to: ${{ secrets.MAIL_TO }}
          from: Swing scanner <${{ secrets.MAIL_USERNAME }}>
          body: file://Equity/output/news/summary.txt
          attachments: Equity/output/news/*.xlsx
